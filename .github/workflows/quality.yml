name: quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Collect complete standalone offline inventory
        run: python -B scripts/ci_tests.py collect --revision "${{ env.TEST_REVISION }}" --output "${{ runner.temp }}/iqs-s6"
      - name: Execute complete standalone offline suite
        run: python -B scripts/ci_tests.py run --revision "${{ env.TEST_REVISION }}" --output "${{ runner.temp }}/iqs-s6"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iqs-standalone-${{ matrix.platform }}
          path: ${{ runner.temp }}/iqs-s6/
          retention-days: 7
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: offline
    env:
      TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: iqs-standalone-*
          path: evidence
          merge-multiple: true
      - name: Verify exact-revision execution for both standalone inventories
        run: >-
          python -B -m tools.anti_trick_gate_spec coverage --revision "${{ env.TEST_REVISION }}"
          --policy tools/ci_test_policy.json --platform linux --platform windows evidence/s6-*.json
