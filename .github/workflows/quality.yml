name: quality

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Check transport, feedback and public owner contracts
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_iqs_provider_transport_diagnostics.py
          tests/test_runtime_feedback_boundaries.py
          tests/test_runtime_recovery_contract.py
          tests/test_dashboard_batches.py::test_unexpected_worker_failure_is_visible_and_resume_rechecks_before_dispatch
          tests/test_dashboard_module_boundaries.py
          tests/test_shared_public_boundaries.py
          tests/test_stockwiki_g2b_frozen_golden.py
          tests/test_legacy_freshness_owner_port.py
