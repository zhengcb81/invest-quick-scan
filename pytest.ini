[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = runs docs vendor .git .codegraph .pytest_cache __pycache__
markers =
    unit: deterministic unit test
    contract: public or internal contract regression
    e2e_offline: real offline end-to-end fixture
    regression: historical failure regression
    owner_assets: requires explicit external owner test assets or browser builds
    windows_only: native Windows behavior
    live: explicitly opted-in external or paid execution
